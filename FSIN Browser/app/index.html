<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FSIN</title>
  <link rel="icon" type="image/png" href="assets/fsin-icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="start">
    <section class="brand">
      <img src="assets/fsin-icon-192.png" alt="" class="brand-icon">
      <h1>FSIN</h1>
      <p>Full Screen Internet</p>
    </section>

    <form id="searchForm" class="search" autocomplete="off">
      <input id="searchInput" type="text" spellcheck="false" placeholder="Search or enter a website">
      <button type="submit">Go</button>
    </form>

    <nav class="quick-links" aria-label="Quick links">
      <a href="https://www.bing.com">Bing</a>
      <a href="https://www.google.com">Google</a>
      <a href="https://www.youtube.com">YouTube</a>
      <a href="https://www.wikipedia.org">Wikipedia</a>
    </nav>
  </main>

  <script src="start.js"></script>
</body>
</html>
