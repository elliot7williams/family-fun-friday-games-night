<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Accessibility</title>
  <style>
    body { font-family: Segoe UI; color: #1f2937; background: #ffffff; }
    main { width: 680px; }
    .gone { display: none; }
  </style>
</head>
<body>
  <header><p>Lea semantic fixture</p></header>
  <nav aria-label="Fixture navigation"><a id="home-link" href="#main-title" accesskey="h">Home</a></nav>
  <main>
    <h1 id="main-title">Semantic access</h1>
    <p id="intro">A compact accessibility model for Lea hosts.</p>
    <section aria-labelledby="form-title">
      <h2 id="form-title">Account details</h2>
      <form aria-labelledby="form-title">
        <label for="user-name">Display name</label>
        <input id="user-name" name="name" value="Elliot" required aria-describedby="name-help">
        <span id="name-help">Shown beside your work.</span>
        <label>Password <input id="secret" name="secret" type="password" value="do-not-expose" readonly></label>
        <label><input id="news" name="news" type="checkbox" checked> Product news</label>
        <button id="save" type="button" aria-pressed="true">Save account</button>
      </form>
    </section>
    <details id="more">
      <summary id="more-summary">More details</summary>
      <p id="more-copy">Disclosure content.</p>
    </details>
    <progress id="load-progress" aria-label="Import progress" max="10" value="4">4 of 10</progress>
    <table id="people">
      <caption>Contributors</caption>
      <thead><tr><th scope="col">Name</th><th scope="col">Role</th></tr></thead>
      <tbody><tr><th scope="row">Lea</th><td>Engine</td></tr></tbody>
    </table>
    <img id="logo" alt="Lea mark" width="24" height="24" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAA1JREFUGFdj+P///38ACfsD/QvHytQAAAAASUVORK5CYII=">
    <div id="custom" role="switch checkbox" tabindex="0" aria-labelledby="custom-name" aria-label="Ignored label" aria-checked="mixed"></div>
    <span id="custom-name">Compact mode</span>
    <div role="presentation"><a id="presented-link" href="#intro">Presented wrapper link</a></div>
    <button id="hidden-button" class="gone">Hidden action</button>
    <button id="aria-hidden-button" aria-hidden="true">ARIA hidden action</button>
  </main>
  <footer>Lea footer</footer>
</body>
</html>
