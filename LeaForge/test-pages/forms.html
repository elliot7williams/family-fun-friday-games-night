<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Forms Test</title>
  <style>
    body { color: #20242a; background: #f7f8fa; padding: 8px; }
    h1 { color: #0a5f84; }
    label { color: #30363d; margin-top: 8px; }
    input, textarea, select { background: #ffffff; margin-bottom: 6px; padding: 3px; }
    button { background: #e8f2f7; margin-right: 6px; padding: 4px; }
  </style>
</head>
<body>
  <h1>Lea forms</h1>
  <p>Painted by Lea, with one small editor reused for the active text field.</p>
  <form action="form-result.html" method="get">
    <label for="q">Search words</label>
    <input id="q" name="q" value="Lea" placeholder="Type a search" maxlength="40">
    <label for="secret">Password</label>
    <input id="secret" name="secret" type="password" placeholder="Hidden text">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" placeholder="Write a note">Small and fast.</textarea>
    <label for="theme">Theme</label>
    <select id="theme" name="theme">
      <option value="light">Light</option>
      <option value="lea" selected>Lea green</option>
      <option value="legacy" disabled>Legacy</option>
    </select>
    <input type="checkbox" name="updates" value="yes" checked aria-label="Include updates">
    <input type="radio" name="size" value="tiny" checked aria-label="Tiny size">
    <input type="radio" name="size" value="full" aria-label="Full size">
    <input type="reset" value="Reset form">
    <button type="submit" name="mode" value="lea">Open result</button>
  </form>
</body>
</html>
