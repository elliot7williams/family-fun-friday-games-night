<!doctype html>
<html><head><title>Lea frames</title><style>
body { font-family: Segoe UI; color: #23272b; background: #ffffff; margin: 24px; }
header { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #168477; padding-bottom: 12px; }
h1 { font-size: 28px; margin: 0; }
h2 { font-size: 18px; margin-top: 22px; }
button { margin: 4px; }
#track { width: 320px; max-width: 100%; height: 24px; background: #e5e7eb; }
#bar { width: 40px; height: 24px; background: #168477; }
#frames { color: #168477; }
#result { color: #b84235; font-size: 20px; }
</style></head><body>
<header><img src="../../assets/lea.ico" width="40" height="40" alt="Lea"><h1>Lea</h1></header>
<h2>Animation</h2><div id="track"><div id="bar"></div></div>
<button id="frame-start" type="button">Start</button><button id="frame-stop" type="button">Pause</button>
<p id="frames">0</p>
<h2>Counter</h2><button id="counter" type="button">Add</button><span id="result">0</span>
<script>
(function () {
  var pending = 0, first = null, frames = 0, count = 0;
  var bar = document.getElementById('bar');
  function draw(time) {
    if (first === null) first = time;
    var phase = (time - first) % 2000;
    var width = 40 + Math.round(280 * (phase < 1000 ? phase : 2000 - phase) / 1000);
    bar.style.width = width + 'px';
    document.getElementById('frames').textContent = String(++frames);
    pending = requestAnimationFrame(draw);
  }
  document.getElementById('frame-start').addEventListener('click', function () {
    if (pending) return;
    first = null;
    pending = requestAnimationFrame(draw);
  });
  document.getElementById('frame-stop').addEventListener('click', function () {
    if (pending) cancelAnimationFrame(pending);
    pending = 0;
  });
  document.getElementById('counter').addEventListener('click', function () {
    count++;
    queueMicrotask(function () {
      document.getElementById('result').textContent = String(count);
      document.title = 'Lea ' + count;
    });
  });
  window.addEventListener('load', function () { document.title = 'Lea ready'; });
})();
</script></body></html>
