<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Nested Positioning</title>
  <style>
    body { color: #26313b; background: #ffffff; font-family: Segoe UI, sans-serif; }
    h1 { color: #176b4d; }
    #low { position: relative; width: 320px; height: 190px; padding: 10px; z-index: 1; background: #edf7f2; border: 2px solid #176b4d; }
    #clipper { position: relative; width: 125px; height: 44px; overflow: hidden; background: #f5c542; border: 2px solid #8a6d00; }
    #cropped { position: absolute; top: 4px; left: 70px; width: 110px; height: 30px; margin: 0; padding: 2px; z-index: 4; color: #ffffff; background: #176b4d; }
    #escape { position: absolute; right: 20px; bottom: 55px; width: 170px; height: 70px; margin: 0; z-index: 99; color: #ffffff; background: #b91c1c; }
    #high { position: absolute; top: 135px; left: 100px; width: 260px; height: 150px; padding: 10px; z-index: 2; background: #e8e4f8; border: 2px solid #581c87; }
    #cover { position: absolute; top: 25px; left: 30px; width: 170px; height: 70px; margin: 0; z-index: -20; color: #ffffff; background: #7e22ce; }
    #fixed-parent { position: fixed; right: 18px; bottom: 16px; width: 190px; height: 58px; padding: 6px; z-index: 5; background: #dbeafe; border: 2px solid #1e3a8a; }
    #fixed-child { width: 170px; height: 34px; margin: 0; color: #ffffff; background: #1d4ed8; }
    a { color: #ffffff; text-decoration: none; }
    .filler { height: 72px; margin: 4px 0; padding: 4px; background: #f4f6f8; border: 1px solid #c7ced6; }
  </style>
</head>
<body>
  <h1>Nested containing blocks</h1>
  <div id="low">
    <div id="clipper"><p id="cropped"><a href="form-result.html">Clipped nested link</a></p></div>
    <p id="escape"><a href="second.html">High child inside low parent</a></p>
  </div>
  <div id="high"><p id="cover"><a href="dynamic-state.html">Low child inside high parent</a></p></div>
  <div id="fixed-parent"><p id="fixed-child"><a href="forms.html">Fixed nested link</a></p></div>
  <p class="filler">Nested scroll content one</p>
  <p class="filler">Nested scroll content two</p>
  <p class="filler">Nested scroll content three</p>
  <p class="filler">Nested scroll content four</p>
  <p class="filler">Nested scroll content five</p>
  <p class="filler">Nested scroll content six</p>
</body>
</html>
