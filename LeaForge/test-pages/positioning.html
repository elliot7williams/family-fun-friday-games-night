<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Positioning</title>
  <style>
    body { color: #26313b; background: #ffffff; font-family: Segoe UI, sans-serif; }
    h1 { color: #176b4d; }
    a { display: block; width: 260px; height: 70px; padding: 0; color: #ffffff; text-decoration: none; border: 2px solid #26313b; }
    #back { position: relative; left: 20px; z-index: 1; background: #b91c1c; }
    #front { position: relative; top: -82px; left: 40px; z-index: 5; background: #1d4ed8; }
    #right { position: relative; right: 15px; bottom: 10px; z-index: 2; background: #7e22ce; }
    #plain { position: static; top: -300px; left: 200px; z-index: 999; background: #176b4d; }
    #moved-table { position: relative; top: 4px; left: 12px; z-index: 3; width: 180px; color: #26313b; background: #f5c542; border: 2px solid #26313b; }
  </style>
</head>
<body>
  <h1>Positioning and stacking</h1>
  <a id="back" href="second.html">Back layer</a>
  <a id="front" href="dynamic-state.html">Front layer</a>
  <a id="right" href="second.html">Right and bottom offsets</a>
  <a id="plain" href="second.html">Static offsets ignored</a>
  <table id="moved-table"><tr><td>Relative table</td></tr></table>
</body>
</html>
