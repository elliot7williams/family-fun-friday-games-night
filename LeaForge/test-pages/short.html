<!doctype html>
<html>
<head>
  <title>Lea Short Syntax</title>
  <script>
    t("Lea Short Lab");
    bg("#fff7ed");
    fg("#7c2d12");
    fs(12);
  </script>
</head>
<body>
  <h1>Lea Short Syntax</h1>
  <p>This page uses Lea's compact command aliases.</p>
  <pre>t("Title")  a("Alert")  bg("#color")  fg("#color")  fs(12)</pre>
  <button onclick="a('Short alert works!')">a</button>
  <button onclick="t('New Short Title')">t</button>
</body>
</html>
