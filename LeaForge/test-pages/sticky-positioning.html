<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Sticky Positioning</title>
  <style>
    body { color: #26313b; background: #ffffff; font-family: Segoe UI, sans-serif; }
    h1 { color: #176b4d; }
    #lead, #tail { height: 230px; margin: 6px 0; background: #edf2f7; }
    #rail { position: relative; height: 480px; padding: 8px; overflow: hidden; border: 2px solid #176b4d; background: #e8f5ef; }
    #sticky { position: sticky; top: 14px; height: 104px; padding: 6px; z-index: 4; overflow: hidden; color: #ffffff; background: #1d4ed8; border: 2px solid #1e3a8a; }
    #sticky-child { width: 230px; height: 30px; margin: 0 0 6px; color: #ffffff; background: #176b4d; }
    #sticky-link { color: #ffffff; text-decoration: none; }
    #sticky-field { display: block; width: 220px; height: 30px; margin: 0; }
    #follower { height: 54px; margin: 8px 0; background: #fff4c2; }
    #rail-fill { height: 270px; margin: 8px 0; background: #f4f6f8; }
    #bottom { position: sticky; bottom: 12px; height: 42px; margin: 8px 0; background: #7e22ce; }
    #invalid { position: relative; position: floating; left: 9px; height: 36px; background: #fee9d8; }
  </style>
</head>
<body>
  <h1>Bounded sticky positioning</h1>
  <p id="lead">Scroll lead</p>
  <section id="rail">
    <div id="sticky">
      <p id="sticky-child"><a id="sticky-link" href="second.html">Sticky link</a></p>
      <input id="sticky-field" aria-label="Sticky field" value="retained sticky value">
    </div>
    <p id="follower">Normal flow follows the sticky slot.</p>
    <p id="rail-fill">The rail provides a bounded containing block.</p>
    <p id="bottom">Bottom inset state</p>
  </section>
  <p id="invalid">Invalid position preserves relative.</p>
  <p id="tail">Scroll tail</p>
</body>
</html>
