<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea SVG geometry</title>
  <style>
    body { background: #f6f8fb; color: #172554; font-family: Segoe UI; }
    svg { display: block; background: #ffffff; border: 2px solid #cbd5e1; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>SVG geometry and transforms</h1>
  <svg id="geometry" width="360" height="200" viewBox="0 0 180 100">
    <title>Curves and transformed shapes</title>
    <path id="cubic" d="M10 30 c10 -30 20 -30 30 0 s20 30 30 0" fill="none" stroke="#dc2626" stroke-width="3"></path>
    <path id="quadratic" d="M10 70 q15 -30 30 0 t30 0" fill="none" stroke="#7c3aed" stroke-width="3"></path>
    <path id="arc" d="M80 50 a20 10 30 0 1 40 0" fill="none" stroke="#ea580c" stroke-width="4"></path>
    <g transform="translate(120 10)">
      <g transform="scale(1.5)">
        <rect id="nested-transform" x="0" y="0" width="12" height="10" fill="#0d9488"></rect>
      </g>
    </g>
    <rect id="rotate-transform" x="84" y="14" width="12" height="6" fill="#2563eb" transform="rotate(90 90 20)"></rect>
    <rect id="skew-x" x="125" y="38" width="10" height="8" fill="#ca8a04" transform="skewX(45)"></rect>
    <rect id="skew-y" x="145" y="30" width="10" height="8" fill="#16a34a" transform="skewY(-10)"></rect>
    <a href="#geometry-target">
      <rect id="matrix-link" x="0" y="0" width="14" height="10" fill="#0369a1" transform="matrix(1 0 0 1 145 78)"></rect>
    </a>
    <circle id="style-transform" cx="0" cy="0" r="6" fill="#db2777" style="transform:translate(132 82)"></circle>
    <rect id="invalid-transform" x="2" y="88" width="8" height="8" fill="#334155" transform="scale(999999)"></rect>
    <path id="invalid-arc" d="M1 1 A5 5 0 2 0 10 10" fill="#000000"></path>
  </svg>

  <svg id="aspect-none" width="200" height="100" viewBox="0 0 100 100" preserveAspectRatio="none">
    <rect x="0" y="0" width="100" height="100" fill="#dc2626"></rect>
  </svg>
  <svg id="aspect-min" width="200" height="100" viewBox="0 0 100 100" preserveAspectRatio="xMinYMax meet">
    <rect x="0" y="0" width="100" height="100" fill="#16a34a"></rect>
  </svg>
  <svg id="aspect-slice" width="200" height="100" viewBox="0 0 100 100" preserveAspectRatio="xMidYMax slice">
    <rect x="0" y="0" width="100" height="50" fill="#dc2626"></rect>
    <rect x="0" y="50" width="100" height="50" fill="#2563eb"></rect>
  </svg>
  <p id="geometry-target">Transformed SVG link target</p>
</body>
</html>
