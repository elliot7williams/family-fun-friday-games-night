<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Tables</title>
  <style>
    body { color: #20262e; background: #ffffff; }
    table { width: 480px; border: 2px solid #18734b; margin-bottom: 10px; }
    th, td { padding: 6px; border: 1px solid #9aa4af; }
    th { color: #124f36; background: #e8f4ed; font-weight: bold; }
    td { background: #f8fafb; }
  </style>
</head>
<body>
  <h1>Compact aliases</h1>
  <table>
    <caption>Lea engine commands</caption>
    <thead>
      <tr><th>Alias<th>Meaning<th>Status
    </thead>
    <tbody>
      <tr><td>Go<td>Navigate to a page<td>Ready
      <tr><td colspan="2">Compact row and cell layout<td>Ready
      <tr><td colspan="3"><strong>Nested content</strong><p>Stays inside a cell.</p><a href="second.html">Open linked page</a>
    </tbody>
  </table>
  <p>Table layout continues with normal page content.</p>
</body>
</html>
