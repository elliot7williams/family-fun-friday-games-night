<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Border Radius Test</title>
  <style>
    :root { --curve: 18px 36px; }
    body { width: 640px; color: #172033; background: #ffffff; }
    h1 { color: #0f766e; }
    #solid { display: block; width: 220px; height: 70px; padding: 8px; border: 6px solid #166534; background: #fef3c7; border-radius: 30px 12px 24px 4px / 20px 8px 30px 4px; }
    #clipper { width: 180px; height: 70px; border: 4px solid #7c3aed; background: #ede9fe; border-radius: 28px; overflow: hidden; }
    #clip-child { width: 260px; height: 70px; margin: 0; background: #ef4444; }
    #dashed { width: 210px; height: 42px; border: 4px dashed #0369a1; background: #e0f2fe; border-radius: 50% 25% / 18px 10px; }
    #field { width: 200px; height: 40px; background: #dcfce7; border-radius: var(--curve); }
    #atomic { border-radius: 1px 2px 3px 4px / 5px 6px 7px 8px; border-radius: 9px / bad; }
    #priority { border-radius: 3px !important; border-top-left-radius: 22px 11px !important; border-top-left-radius: 4px; }
    #reset { border-radius: 12px; border-radius: initial; }
    #bounded { border-radius: 3000px 1500%; }
  </style>
</head>
<body>
  <h1>Rounded boxes</h1>
  <a id="solid" href="second.html">Rounded link background and solid border</a>
  <div id="clipper"><p id="clip-child">Rounded overflow clips this wide red child.</p></div>
  <p id="dashed">Rounded dashed border</p>
  <input id="field" value="Rounded field">
  <p id="atomic">Invalid shorthand preserves the valid ellipse.</p>
  <p id="priority">Important corner longhand wins.</p>
  <p id="reset">Reset corners.</p>
  <p id="bounded">Bounded oversized corners.</p>
</body>
</html>
