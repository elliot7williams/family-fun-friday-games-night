<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Box Sizing</title>
  <style>
    body { width: 680px; color: #20242a; background: #ffffff; }
    .sample { box-sizing: content-box; display: block; margin: 0 0 8px; background: #e8f5ef; }
    #content-box { box-sizing: content-box; width: 200px; height: 50px; padding: 10px 12px; border: 4px solid #176b4d; }
    #border-box { box-sizing: border-box; width: 200px; height: 50px; padding: 10px 12px; border: 4px solid #1e3a8a; }
    #border-min { box-sizing: border-box; width: 100px; min-width: 180px; height: 20px; min-height: 42px; padding: 5px 10px; border: 5px solid #9a6700; }
    #border-max { box-sizing: border-box; box-sizing: padding-box; width: 260px; max-width: 170px; height: 80px; max-height: 44px; padding: 8px; border: 3px solid #7e22ce; }
    #border-field { box-sizing: border-box; display: block; width: 180px; height: 44px; margin: 0 0 8px; padding: 6px; border: 2px solid #687684; }
    #border-image { box-sizing: border-box; display: block; width: 100px; height: 60px; margin: 0 0 8px; padding: 5px; border: 2px solid #1e3a8a; }
    #border-flex { box-sizing: border-box; display: flex; width: 420px; padding: 10px; gap: 10px; border: 2px solid #176b4d; }
    #flex-content { width: 140px; height: 40px; margin: 0; padding: 8px; border: 3px solid #1e3a8a; background: #e6efff; }
    #flex-border { box-sizing: border-box; flex: 0 1 140px; height: 40px; margin: 0; padding: 8px; border: 3px solid #7e22ce; background: #f0e8fa; }
    #border-table { box-sizing: border-box; width: 240px; height: 100px; padding: 8px; border: 4px solid #176b4d; }
    #border-cell { box-sizing: border-box; height: 52px; padding: 6px; border: 2px solid #9a6700; background: #fff4c2; }
  </style>
</head>
<body>
  <h1>Box sizing fixture</h1>
  <div id="content-box" class="sample">Content-box dimensions include extra padding and border outside the declaration.</div>
  <a id="border-box" class="sample" href="second.html">Border-box dimensions contain padding and border.</a>
  <div id="border-min" class="sample">Border-box minimum</div>
  <div id="border-max" class="sample">Border-box maximum</div>
  <input id="border-field" value="Border-box field">
  <img id="border-image" alt="Border-box image" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAANSURBVBhXYxDP9v0PAAM7Ac+IRop4AAAAAElFTkSuQmCC">
  <section id="border-flex" class="sample">
    <p id="flex-content">Content flex item</p>
    <p id="flex-border">Border flex item</p>
  </section>
  <table id="border-table">
    <tbody><tr><td id="border-cell">Border-box table cell</td></tr></tbody>
  </table>
</body>
</html>
