<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Box Model Test</title>
  <style>
    body { width: 620px; color: #20242a; background: #f7f8fa; padding: 10px; }
    h1 { color: #0a5f84; }
    .solid { width: 280px; padding: 10px; border: 4px solid #18734b; background: #eef6f1; }
    .dashed { width: 360px; height: 54px; padding: 8px; border: 3px dashed #9f3d24; background: #fff5f1; }
    .sides { width: 320px; padding: 6px 12px; border-width: 5px 2px 3px 1px; border-style: dotted; border-color: #315b9a; background: #eef4ff; }
  </style>
</head>
<body>
  <h1>Borders and sizing</h1>
  <p class="solid">A 280 pixel content box with padding and a solid border.</p>
  <p class="dashed">A fixed width and height with a dashed border.</p>
  <p class="sides">Four independent border widths around one content box.</p>
</body>
</html>
