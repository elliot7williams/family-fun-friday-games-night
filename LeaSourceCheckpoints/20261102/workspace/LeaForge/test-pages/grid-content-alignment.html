<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea bounded grid content alignment</title>
  <style>
    body { background: #f7faf8; color: #18372f; font-family: Segoe UI; }
    h1 { color: #134e4a; }
    .grid { display: grid; width: 300px; height: 220px; grid: 40px 60px / 80px 100px; margin-bottom: 12px; background: #edf6f2; }
    .item { margin: 0; padding: 0; background: #dce9ff; }
    #center-grid { gap: 10px; place-content: center; }
    #center-a { background: #d8f1e5; }
    #center-d { background: #c7e9ff; }
    #axis-grid { gap: 10px; place-content: end start; }
    #between-grid { gap: 10px; place-content: space-between; }
    #mixed-grid { place-content: space-around space-evenly; }
    #mixed-a { background: #fde3c5; }
    #mixed-d { background: #d8f1e5; }
    #longhand-content { align-content: center; justify-content: end; }
    #atomic-content {
      align-content: end;
      justify-content: center;
      place-content: space-around diagonal;
    }
    #reset-content {
      place-content: end;
      place-content: initial;
    }
    #stretch-content { place-content: stretch; }
    #content-target { background: #edf6f2; }
    #after-content { width: 320px; padding: 5px; border-left: 3px solid #b91c1c; background: #f8eeee; }
  </style>
</head>
<body>
  <h1>Bounded grid content alignment</h1>
  <section id="center-grid" class="grid">
    <p id="center-a" class="item">A</p><p id="center-b" class="item">B</p>
    <p id="center-c" class="item">C</p><p id="center-d" class="item">D</p>
  </section>
  <section id="axis-grid" class="grid">
    <p id="axis-a" class="item">A</p><p id="axis-b" class="item">B</p>
    <p id="axis-c" class="item">C</p><p id="axis-d" class="item">D</p>
  </section>
  <section id="between-grid" class="grid">
    <p id="between-a" class="item">A</p><p id="between-b" class="item">B</p>
    <p id="between-c" class="item">C</p><p id="between-d" class="item">D</p>
  </section>
  <section id="mixed-grid" class="grid">
    <p id="mixed-a" class="item">A</p><p id="mixed-b" class="item">B</p>
    <p id="mixed-c" class="item">C</p><a id="mixed-d" class="item" href="#content-target">D</a>
  </section>
  <section id="longhand-content" class="grid"><p id="longhand-item" class="item">Longhand values</p></section>
  <section id="atomic-content" class="grid"><p class="item">Atomic values</p></section>
  <section id="reset-content" class="grid"><p class="item">Reset values</p></section>
  <section id="stretch-content" class="grid"><p class="item">Stretch values</p></section>
  <p id="content-target">Grid content alignment fragment target</p>
  <p id="after-content">Normal document flow continues below aligned track groups.</p>
</body>
</html>
