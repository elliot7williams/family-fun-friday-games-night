<!doctype html>
<html>
<head>
  <title>Lea Layout Test</title>
  <style>
    body { background: #f8fafc; color: #172033; margin: 12px; padding: 10px; }
    .panel .note { color: #0369a1; background: #e0f2fe; margin: 12px 20px; padding: 8px 14px; }
    #main p.note { color: #7e22ce; font-size: 17px; }
    .panel .quiet { margin-left: 42px; color: #475569; }
  </style>
</head>
<body>
  <h1>Descendants And Spacing</h1>
  <section id="main" class="panel">
    <p class="note">ID and descendant rules both apply here.</p>
    <p class="quiet">This paragraph has a larger left margin.</p>
  </section>
</body>
</html>
