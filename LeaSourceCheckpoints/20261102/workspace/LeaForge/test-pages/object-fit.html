<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Object Fit Test</title>
  <style>
    body { background: #ffffff; color: #123047; object-fit: cover; object-position: right bottom; }
    img { display: block; margin: 4px; background: #ffffff; }
    #fill { width: 120px; height: 80px; object-fit: fill; }
    #contain { width: 120px; height: 100px; object-fit: contain; }
    #cover-left { width: 120px; height: 100px; object-fit: cover; object-position: left top; }
    #cover-right { width: 120px; height: 100px; object-fit: cover; object-position: right bottom; }
    #none { width: 120px; height: 60px; object-fit: none; object-position: 25% 75%; }
    #scale-down { width: 12px; height: 12px; object-fit: scale-down; object-position: center; }
    #atomic { width: 80px; height: 40px; object-fit: contain; object-fit: stretch; }
    #position-atomic { width: 80px; height: 40px; object-position: 13px 7px; object-position: left center bottom; }
    #reset { width: 80px; height: 40px; object-fit: cover; object-fit: initial; object-position: right bottom; object-position: unset; }
    #child { width: 80px; height: 40px; }
    #variable { --lea-fit: cover; --lea-place: right center; width: 80px; height: 80px; object-fit: var(--lea-fit); object-position: var(--lea-place); }
    #priority { width: 80px; height: 80px; object-fit: contain !important; object-position: left top !important; }
    #mapped-fit { width: 160px; height: 120px; object-fit: contain; object-position: center; }
    #dynamic { width: 80px; height: 80px; object-fit: contain; }
    @media screen and (max-width: 400px) {
      #dynamic { object-fit: cover; object-position: right bottom; }
    }
  </style>
</head>
<body>
