<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Selector Functions</title>
  <style>
    body { color: #334155; }
    :is(h1, h2, .lead) { color: #176b4d; }

    :is(.card, #unused) { color: #0f4c81; }
    .card { color: #a13b18; }

    .where-target { color: #176b4d; padding: 9px; }
    :where(#where-target, .missing) { color: #a13b18; padding: 5px; }

    .item { background: #ffffff; }
    .item:not(.skip, [data-off], #never) {
      background: #edf7f2;
      font-weight: bold;
    }

    #stage > :is(p.note, div.note) { width: 120px; }
    :is(.seed, .other) + :where(p, div) { margin-left: 17px; }

    :is(input, button):not(:disabled, [data-blocked]) {
      background: #dff6e9;
      font-weight: bold;
    }

    :is(input, button):not(:enabled, [data-blocked]) {
      color: #8a4b22;
      font-style: italic;
    }

    #hover { color: #176b4d; padding-left: 7px; }
    #hover:is(.hot, #none):hover { color: #a13b18; padding-left: 19px; }

    #field { border-left: 2px solid #176b4d; padding-left: 4px; }
    #field:is(.focusable, #none):focus { border-left: 5px solid #0f4c81; padding-left: 12px; }

    #invalid:is(.a, .b, .c, .d, .e, .f, .g, .h, .i) { color: #c02050; }
    #invalid:not(.a, , .c) { background: #c02050; }
    #invalid:not(.a > .b, .c) { width: 999px; }
    #invalid:not(:is(.a), .c) { height: 999px; }
    #invalid:is(.a,.b,.c,.d,.e,.f):where(.a,.b,.c,.d,.e,.f):not(.x,.y,.z,.u,.v,.w) { padding: 99px; }

    #forgiving:is(.unsupported > .child, .fallback) { width: 144px; }
    #forgiving:where(:not(.unsupported), .fallback) { height: 44px; }
  </style>
</head>
<body>
  <h1>Selector functions</h1>
  <section id="stage">
    <p id="card" class="card">Maximum is specificity</p>
    <p id="where-target" class="where-target">Zero where specificity</p>
    <p id="keep" class="item">Kept item</p>
    <p id="skip" class="item skip">Skipped by class</p>
    <p id="off" class="item" data-off>Skipped by attribute</p>
    <p id="seed" class="seed">Adjacent seed</p>
    <p id="adjacent" class="note">Adjacent note</p>
    <div id="note-div" class="note">Div note</div>
    <p id="hover" class="hot">Dynamic is hover</p>
    <p id="invalid" class="a c">Rejected selectors</p>
    <p id="forgiving" class="fallback">Forgiving selector alternatives</p>
    <input id="field" class="focusable" value="Retained selector value">
    <input id="enabled" value="Enabled selector">
    <input id="disabled" value="Disabled selector" disabled>
    <button id="blocked" data-blocked>Blocked selector</button>
  </section>
</body>
</html>
