<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lea Text Layout</title>
  <style>
    body { color: #20262e; background: #ffffff; }
    p { width: 240px; padding: 4px; border: 1px solid #9aa4af; }
    .center { text-align: center; line-height: 28px; }
    .right { text-align: right; line-height: 175%; }
    .justify { width: 220px; text-align: justify; line-height: 24px; }
    table { width: 280px; border: 1px solid #18734b; }
    td { padding: 4px; text-align: right; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>Text Layout</h1>
  <p class="center">Centered words on the first line<br>and the second line</p>
  <p class="right">Right aligned first line<br>and second line</p>
  <p class="justify">Lea spreads these compact words across each wrapped line while leaving the final line natural.</p>
  <table><tr><td>Right aligned table text wraps inside its compact cell.</td></tr></table>
</body>
</html>
